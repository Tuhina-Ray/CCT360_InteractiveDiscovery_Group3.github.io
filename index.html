<!DOCTYPE html>
<html>
    
    <head>
        <title>interactive discovery</title>
        <link rel="stylesheet" href="css/style.css">

    </head>

    <body>

        <h1>Interactive Discovery</h1>

        <!-- TITLE SCREEN -->
        <section id="startScreen" class="startScreen">
            <h1> GAME TITLE</h1>

            <p class="gameSubtitle">CCT360, by:...</p>

            <button id="startButton">Start Investigation</button>

        </section>


         <main class="gameLayout" hidden>

            <!-- DETECTIVE BOARD -->

            <section class="board">

                <img src="images/board.jpg" alt="Detective board">

                <section class="stageOne">

                    <button id="placeholderClue" class="clueButton">
                        <img src="images/placeholder.png" alt="Placeholder evidence clue">
                        
                    </button>

                    <button id="secondClue" class="clueButton">
                        <img src="images/placeholder.png" alt="another clue">
                    </button>

                </section>
                <section class="stageTwo"></section>
                <section class="stageThree"></section>
            </section>

            <!-- PHONE -->

            <section class="phone">
                <button id ="phoneButton" class = phoneButton>
                    <img src="images/Phone.png" alt="Telephone">
                </button>
                
            </section>


            <!-- DIALOGUE BOX -->

            <div id="dialogueOverlay" class ="dialogueOverlay" hidden>

                <section class="dialogueBox">
                    <h2 id="speakerName">Lieutenant</h2>

                    <p id ="dialogueText">
                        Incoming call... 
                    </p>

                    <button id="nextButton">Continue</button>

                </section>

            </div>

            <!-- CLUE OVERLAY -->

            <div id="clueOverlay" class="clueOverlay" hidden>
                <section class="clueBox">

                    <img id="clueImage"
                        src="images/placeholder.png"
                        alt="Evidence clue">

                    <div class="clueDetails">
                        <h2 id="clueTitle">Evidence #01</h2>

                        <p id="clueDescription">
                            put clue description here
                        </p>

                        <button id="backToBoardButton">Back to Board</button>
                    </div>

                </section>
            </div>

             

        </main>
        <audio id="ringSound" src="sounds/PhoneRinging.mp3" loop></audio>

        <script src="js/script.js"></script>
        
    </body>
</html>
