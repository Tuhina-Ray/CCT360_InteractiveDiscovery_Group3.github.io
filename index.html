<!DOCTYPE html>
<html>
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>interactive discovery</title>
        <link rel="stylesheet" href="css/style.css">

    </head>

    <body>

        <h1>Interactive Discovery: My Pet Cat🐾</h1>

        <p id="catMessage"> Your cat is waiting for you!</p>
        <p id="eventMessage"></p>

        <div id="mainContent">
            
            <div id="catStatus">
                <h2>Cat Status</h2>

                <div class="status-row">
                    <span class="status-label">Fullness:</span>
                    <div class="progress-container">
                        <div id="fullnessBar" class="progress-bar"></div>
                    </div>
                    <span id="fullness">50</span>%
                </div>

                <div class="status-row">
                    <span class="status-label">Hydration:</span>
                    <div class="progress-container">
                        <div id="hydrationBar" class="progress-bar"></div>
                    </div>
                    <span id="hydration">30</span>%
                </div>

                <div class="status-row">
                    <span class="status-label">Happiness:</span>
                    <div class="progress-container">
                        <div id="happinessBar" class="progress-bar"></div>
                    </div>
                    <span id="happiness">50</span>%
                </div>

                <div class="status-row">
                    <span class="status-label">Fitness:</span>
                    <div class="progress-container">
                        <div id="fitnessBar" class="progress-bar"></div>
                    </div>
                    <span id="fitness">50</span>%
                </div>

                <div class="status-row">
                    <span class="status-label">Cleanliness:</span>
                    <div class="progress-container">
                        <div id="cleanlinessBar" class="progress-bar"></div>
                    </div>
                    <span id="cleanliness">70</span>%
                </div>
            </div>
            
            <div id="imageContainer">
                <img id="catImage" src="images/content-cat.jpg" alt="content cat">
            </div>

            <div id="buttons">
                <button id="playButton">Play</button>
                <button id="feedButton">Feed</button>
                <button id="waterButton">Give Water</button>
                <button id="cleanButton">Clean</button>
            </div>
        </div>
        
        <hr>

        <div id="achievements">
            <h2>Achievements</h2>
            <p id="badgeMessage">Take care of your cat to unlock badges!</p>
            <div id="badgeContainer">
                <!-- Badges will be displayed here -->
            </div> 
        </div>
        


        <script src="js/script.js" type="text/javascript"></script>


    </body>


</html>
